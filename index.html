<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIQUE YTB GAMING HUB</title>
    <link rel="icon" type="image/jpeg" href="Arique YTB.jpg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0c10;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            margin-top: 20px;
            text-align: center;
            padding: 15px;
        }
        header h1 {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
            font-size: 2.2rem;
            display: inline-block;
            vertical-align: middle;
        }
        .site-logo {
            height: 45px;
            vertical-align: middle;
            margin-right: 12px;
            border-radius: 50%;
            border: 2px solid #ff3333;
        }
        #hub-menu {
            text-align: center;
            margin-top: 30px;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }
        .hub-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #ff9999;
        }
    </style>
</head>
<body>

    <header>
        <img src="Arique YTB.jpg" alt="Logo" class="site-logo">
        <h1>ARIQUE YTB GAMING HUB</h1>
    </header>

    <div id="hub-menu">
        <div class="hub-title">Welcome to Arique YTB Gaming Hub</div>
    </div>

</body>
</html>
